<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Subtle grid / academic geometric rays -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#glow)">
    <!-- Cap Diamond -->
    <path d="M 256 100 L 390 152 L 256 204 L 122 152 Z" fill="url(#goldGrad)"/>
    <path d="M 256 100 L 390 152 L 256 204 L 122 152 Z" fill="none" stroke="#fef3c7" stroke-width="3"/>
    
    <!-- Cap Skullcap -->
    <path d="M 180 180 L 180 220 C 180 248 332 248 332 220 L 332 180" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6"/>
    
    <!-- Tassel -->
    <path d="M 256 152 L 396 172 L 406 240" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="406" cy="246" r="6" fill="#f59e0b"/>
    <circle cx="256" cy="152" r="5" fill="#fef3c7"/>
  </g>

  <!-- Open Academic Book (ABNT) -->
  <g filter="url(#glow)" transform="translate(0, 40)">
    <!-- Book Pages Background Spine -->
    <path d="M 256 240 C 290 220 370 216 410 230 L 410 350 C 370 336 290 340 256 360 C 222 340 142 336 102 350 L 102 230 C 142 216 222 220 256 240 Z" fill="#1e293b" stroke="#475569" stroke-width="4"/>

    <!-- Left Book Page -->
    <path d="M 256 240 C 220 222 148 220 110 232 L 110 346 C 148 334 220 336 256 354 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5"/>
    
    <!-- Right Book Page -->
    <path d="M 256 240 C 292 222 364 220 402 232 L 402 346 C 364 334 292 336 256 354 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5"/>

    <!-- Left page text lines (Academic ABNT formatting) -->
    <line x1="140" y1="256" x2="228" y2="256" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="140" y1="276" x2="236" y2="276" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="140" y1="294" x2="236" y2="294" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="140" y1="312" x2="200" y2="312" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Right page text lines -->
    <line x1="276" y1="256" x2="372" y2="256" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="276" y1="276" x2="372" y2="276" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="276" y1="294" x2="372" y2="294" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="276" y1="312" x2="320" y2="312" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Central bookmark ribbon -->
    <path d="M 256 240 L 256 376 L 246 364 L 256 352" fill="url(#goldGrad)"/>
    <line x1="256" y1="240" x2="256" y2="374" stroke="#fbbf24" stroke-width="4"/>
  </g>

  <!-- Laurel Wreath at bottom -->
  <g stroke="url(#goldGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 120 400 C 130 436 180 460 256 460 C 332 460 382 436 392 400"/>
    <!-- Leaves Left -->
    <path d="M 140 406 C 130 398 126 388 132 380 C 140 388 144 398 140 406 Z" fill="url(#goldGrad)"/>
    <path d="M 174 428 C 162 422 156 412 164 406 C 172 412 176 422 174 428 Z" fill="url(#goldGrad)"/>
    <path d="M 214 446 C 202 444 196 434 204 428 C 212 432 216 442 214 446 Z" fill="url(#goldGrad)"/>
    <!-- Leaves Right -->
    <path d="M 372 406 C 382 398 386 388 380 380 C 372 388 368 398 372 406 Z" fill="url(#goldGrad)"/>
    <path d="M 338 428 C 350 422 356 412 348 406 C 340 412 336 422 338 428 Z" fill="url(#goldGrad)"/>
    <path d="M 298 446 C 310 444 316 434 308 428 C 300 432 296 442 298 446 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Subtle ABNT Badge at bottom center -->
  <rect x="206" y="440" width="100" height="24" rx="12" fill="#090d16" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="256" y="456" font-family="'Cinzel', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="middle" letter-spacing="1.5">ABNT NBR</text>
</svg>
